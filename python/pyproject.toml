[project]
name = "nameyoulike-core"
version = "0.1.0"
description = "NameYouLike Python 核心引擎：品牌名生成引擎（brandgen）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pypinyin>=0.53"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brandgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
